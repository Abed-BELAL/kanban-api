# Docker Compose = lance PostgreSQL en local sans l'installer à la main.
# Équivalent : un service DB dans un docker-compose Symfony/Nest classique.
# Commande : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432" # accessible sur localhost:5432
    volumes:
      - kanban_data:/var/lib/postgresql/data # garde les données même si on stoppe le conteneur

volumes:
  kanban_data:
