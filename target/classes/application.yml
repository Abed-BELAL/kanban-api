spring:
  application:
    name: kanban-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kanban}
    username: ${SPRING_DATASOURCE_USERNAME:kanban}
    password: ${SPRING_DATASOURCE_PASSWORD:kanban}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 3000

springdoc:
  swagger-ui:
    path: /api

app:
  jwt:
    # HS256 exige une clé d'au moins 32 octets, surchargeable par JWT_SECRET
    secret: ${JWT_SECRET:kanban-dev-jwt-secret-key-32b-min!!}
    expiration: 1h